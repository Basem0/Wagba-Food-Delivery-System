spring.datasource.url=jdbc:h2:mem:wagba;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-secret-that-is-long-enough-for-hmac-signing
jwt.expiration=86400000

# Supplies the mail sender required by email workflows without sending email in tests.
spring.mail.host=localhost
spring.mail.port=2525

# Avoid creating runtime files while the Spring context is tested.
upload.dir=target/test-uploads
