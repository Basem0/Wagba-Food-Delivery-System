<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagba · Restaurant Owner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="logo"><i class="bi bi-shop-window"></i></span> Wagba</div>
      <div class="side-label">Owner</div>
      <a class="side-link active" data-view="dashboard" onclick="navTo('dashboard')"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a class="side-link" data-view="menu" onclick="navTo('menu')"><i class="bi bi-menu-button"></i> Menu</a>
      <a class="side-link" data-view="orders" onclick="navTo('orders')"><i class="bi bi-receipt"></i> Orders</a>
      <div class="side-foot">Run your kitchen with Wagba.</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Overview of your restaurant</div></div>
      </header>
      <div class="content">
        <div id="alertBox"></div>
        <div id="profileBox"></div>

        <div id="view-dashboard" class="view">
          <div id="dashStats" class="row g-3 mb-3"></div>
          <div class="card"><div class="card-body">
            <h5 class="mb-3">Recent orders</h5>
            <div id="dashOrders"></div>
          </div></div>
        </div>

        <div id="view-menu" class="view d-none">
          <div class="row g-3">
            <div class="col-lg-4">
              <div class="card"><div class="card-body">
                <h5>Categories</h5>
                <form id="catForm" onsubmit="return false" class="d-flex gap-2 mb-3">
                  <input id="catName" class="form-control" placeholder="New category name">
                  <button class="btn-brand" onclick="addCategory()"><i class="bi bi-plus-lg"></i></button>
                </form>
                <div id="catList"></div>
              </div></div>
            </div>
            <div class="col-lg-8">
              <div class="card"><div class="card-body">
                <div class="d-flex justify-between align-center mb-3">
                  <h5 class="mb-0">Foods</h5>
                  <button class="btn-brand btn-sm" onclick="openFoodModal(0)"><i class="bi bi-plus-lg"></i> Add Food</button>
                </div>
                <div class="scroll-x"><table class="table wagba"><thead><tr><th>Name</th><th>Price</th><th>Category</th><th></th></tr></thead><tbody id="foodRows"></tbody></table></div>
              </div></div>
            </div>
          </div>
        </div>

        <div id="view-orders" class="view d-none"><div id="orderList" class="row-gap"></div></div>
      </div>
    </div>
  </div>

  <!-- Food modal -->
  <div class="modal fade" id="foodModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Food item</h5><button class="icon-btn" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i></button></div>
        <div class="modal-body">
          <div id="foodAlert"></div>
          <input type="hidden" id="fId">
          <div class="mb-2"><label class="form-label">Name</label><input id="fName" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Description</label><input id="fDesc" class="form-control"></div>
          <div class="row g-2">
            <div class="col-6"><label class="form-label">Price (EGP)</label><input id="fPrice" type="number" step="0.01" class="form-control"></div>
            <div class="col-6"><label class="form-label">Category</label><select id="fCat" class="form-select"></select></div>
          </div>
          <div class="mb-2 mt-2"><label class="form-label">Image URL</label><input id="fImg" class="form-control"></div>
        </div>
        <div class="modal-footer"><button class="btn-ghost" data-bs-dismiss="modal">Cancel</button><button class="btn-brand" onclick="saveFood()">Save</button></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/owner.js"></script>
</body>
</html>
