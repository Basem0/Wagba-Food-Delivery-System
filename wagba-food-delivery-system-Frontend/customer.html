<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagba — Customer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-orbs">
  <div id="nav"></div>
  <div class="dash-layout">
    <nav id="sideNav" class="wagba-side">
      <div class="side-brand"><span class="logo-mark" style="width:36px;height:36px;font-size:1.1rem;"><i class="bi bi-egg-fried"></i></span> Wagba</div>
      <a class="nav-link active" href="#" onclick="go('restaurants',this)"><i class="bi bi-shop"></i> Restaurants</a>
      <a class="nav-link" href="#" onclick="go('cart',this)"><i class="bi bi-cart3"></i> Cart <span id="cartCount" class="badge bg-danger rounded-pill ms-auto"></span></a>
      <a class="nav-link" href="#" onclick="go('orders',this)"><i class="bi bi-receipt"></i> My Orders</a>
      <a class="nav-link" href="#" onclick="go('coupons',this)"><i class="bi bi-ticket-percent"></i> My Coupons</a>
      <a class="nav-link" href="#" onclick="go('reviews',this)"><i class="bi bi-star"></i> My Reviews</a>
    </nav>

    <main class="wagba-main">
      <div id="alertBox"></div>
      <h2 class="section-title" id="pageTitle">Restaurants</h2>

      <section id="restaurants">
        <div id="restaurantList" class="row g-3"></div>
        <div id="foodView" class="d-none mt-3">
          <button class="btn btn-soft btn-sm mb-3" onclick="backToRestaurants()"><i class="bi bi-arrow-left"></i> Back to restaurants</button>
          <h4 id="foodRestaurantName" class="mb-3"></h4>
          <div id="foodList" class="row g-3"></div>
        </div>
      </section>

      <section id="cart" class="d-none">
        <div id="cartList"></div>
        <div id="cartSummary" class="mt-3"></div>
      </section>

      <section id="orders" class="d-none"><div id="orderList"></div></section>
      <section id="coupons" class="d-none"><div id="couponList" class="row g-3"></div></section>
      <section id="reviews" class="d-none"><div id="reviewList"></div></section>
    </main>
  </div>

  <!-- checkout modal -->
  <div class="modal fade" id="checkoutModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-credit-card"></i> Checkout</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="checkoutAlert"></div>
          <div class="mb-2"><label class="form-label">City</label><input id="ckCity" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Street</label><input id="ckStreet" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Building #</label><input id="ckBuilding" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Apartment</label><input id="ckApartment" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Details (optional)</label><input id="ckDetails" class="form-control"></div>
          <div class="mb-2"><label class="form-label">Coupon code (optional)</label><input id="ckCoupon" class="form-control"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-brand" onclick="submitCheckout()">Place Order</button>
        </div>
      </div>
    </div>
  </div>

  <!-- review modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-star-fill"></i> Leave a Review</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="reviewAlert"></div>
          <input type="hidden" id="rvOrderId">
          <div class="mb-2"><label class="form-label">Rating</label>
            <select id="rvRating" class="form-select">
              <option value="5">★★★★★ 5</option><option value="4">★★★★ 4</option>
              <option value="3">★★★ 3</option><option value="2">★★ 2</option><option value="1">★ 1</option>
            </select></div>
          <div class="mb-2"><label class="form-label">Comment</label><textarea id="rvComment" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-brand" onclick="submitReview()">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- tracking modal -->
  <div class="modal fade" id="trackModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title"><i class="bi bi-geo-alt"></i> Track Order #<span id="trkId"></span></h5>
          <button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <div id="trackAlert"></div>
          <div id="trackDriver" class="mb-3"></div>
          <div id="trackTimeline" class="mb-3"></div>
          <div id="map" style="height:320px; border-radius:1rem; z-index:0;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/common.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
