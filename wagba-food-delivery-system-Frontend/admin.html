<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagba — Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-orbs">
  <div id="nav"></div>
  <div class="dash-layout">
    <nav id="adminTabs" class="wagba-side">
      <div class="side-brand"><span class="logo-mark" style="width:36px;height:36px;font-size:1.1rem;"><i class="bi bi-shield-check"></i></span> Wagba</div>
      <a class="nav-link active" href="#" data-v="restaurants"><i class="bi bi-shop"></i> Restaurants</a>
      <a class="nav-link" href="#" data-v="drivers"><i class="bi bi-bicycle"></i> Drivers</a>
      <a class="nav-link" href="#" data-v="coupons"><i class="bi bi-ticket-percent"></i> Coupons</a>
      <a class="nav-link" href="#" data-v="users"><i class="bi bi-people"></i> Users</a>
    </nav>

    <main class="wagba-main">
      <div id="alertBox"></div>
      <section id="restaurants">
        <h2 class="section-title">Pending Restaurants</h2>
        <div id="restList" class="row g-3"></div>
      </section>
      <section id="drivers" class="d-none">
        <h2 class="section-title">Pending Drivers</h2>
        <div id="driverList" class="row g-3"></div>
      </section>
      <section id="coupons" class="d-none">
        <h2 class="section-title">Coupons</h2>
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title"><i class="bi bi-plus-circle"></i> Create Coupon</h5>
                <div id="couponAlert"></div>
                <div class="mb-2"><label class="form-label">Code</label><input id="cCode" class="form-control"></div>
                <div class="mb-2"><label class="form-label">Description</label><input id="cDesc" class="form-control"></div>
                <div class="mb-2"><label class="form-label">Discount Type</label>
                  <select id="cType" class="form-select"><option>FIXED</option><option>PERCENTAGE</option></select></div>
                <div class="mb-2"><label class="form-label">Value</label><input id="cValue" type="number" step="0.01" class="form-control"></div>
                <div class="mb-2"><label class="form-label">Min Order Total</label><input id="cMin" type="number" step="0.01" class="form-control"></div>
                <div class="mb-2"><label class="form-label">Expiry Date</label><input id="cExp" type="date" class="form-control"></div>
                <button class="btn btn-brand w-100" onclick="createCoupon()">Create</button>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title"><i class="bi bi-send"></i> Assign Coupon to User</h5>
                <div id="assignAlert"></div>
                <div class="mb-2"><label class="form-label">User ID</label><input id="aUserId" type="number" class="form-control" placeholder="see Users tab"></div>
                <div class="mb-2"><label class="form-label">Coupon Code</label><input id="aCode" class="form-control"></div>
                <button class="btn btn-brand w-100" onclick="assignCoupon()">Assign</button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="users" class="d-none">
        <h2 class="section-title">Users</h2>
        <div id="userList"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
