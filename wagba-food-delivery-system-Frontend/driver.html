<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagba · Driver</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="nav"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="side-brand"><span class="logo"><i class="bi bi-bicycle"></i></span> Wagba</div>
      <div class="side-label">Driver</div>
      <a class="side-link active" data-view="dashboard" onclick="navTo('dashboard')"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a class="side-link" data-view="available" onclick="navTo('available')"><i class="bi bi-inboxes"></i> Available</a>
      <a class="side-link" data-view="mine" onclick="navTo('mine')"><i class="bi bi-bag-check"></i> My Deliveries</a>
      <div class="side-foot">Hit the road and earn.</div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Your delivery overview</div></div>
      </header>
      <div class="content">
        <div id="alertBox"></div>
        <div id="profileBox"></div>

        <div id="view-dashboard" class="view">
          <div id="dashStats" class="row g-3 mb-3"></div>
          <div class="card"><div class="card-body">
            <div class="d-flex justify-between align-center mb-2">
              <h5 class="mb-0"><i class="bi bi-broadcast"></i> Live location sharing</h5>
              <button id="locBtn" class="btn-brand btn-sm" onclick="toggleLiveLocation()"><i class="bi bi-broadcast"></i> Share Live Location</button>
            </div>
            <p id="locStatus" class="muted small mb-2">Not sharing yet.</p>
            <div id="locMap" class="map-box d-none"></div>
          </div></div>
        </div>

        <div id="view-available" class="view d-none">
          <div id="availList" class="row g-3"></div>
        </div>
        <div id="view-mine" class="view d-none">
          <div id="mineList" class="row g-3"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/common.js"></script>
  <script src="js/driver.js"></script>
</body>
</html>
