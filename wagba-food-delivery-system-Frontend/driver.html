<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagba — Driver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-orbs">
  <div id="nav"></div>
  <div class="dash-layout">
    <nav id="driverTabs" class="wagba-side">
      <div class="side-brand"><span class="logo-mark" style="width:36px;height:36px;font-size:1.1rem;"><i class="bi bi-bicycle"></i></span> Wagba</div>
      <a class="nav-link active" href="#" data-v="available"><i class="bi bi-geo-alt"></i> Available</a>
      <a class="nav-link" href="#" data-v="mine"><i class="bi bi-bag-check"></i> My Deliveries</a>
    </nav>

    <main class="wagba-main">
      <div id="alertBox"></div>
      <div id="profileBox"></div>
      <div id="dashboard" class="d-none">
        <div class="card mb-4 anim-fade-up">
          <div class="card-body d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
              <h6 class="m-0"><i class="bi bi-broadcast text-danger"></i> Live Location Sharing</h6>
              <small class="muted" id="locStatus">Not sharing</small>
            </div>
            <button class="btn btn-brand" id="locBtn" onclick="toggleLiveLocation()">
              <i class="bi bi-broadcast"></i> Share Live Location
            </button>
          </div>
        </div>
        <section id="available">
          <h2 class="section-title">Available Deliveries</h2>
          <div id="availList" class="row g-3"></div>
        </section>
        <section id="mine" class="d-none">
          <h2 class="section-title">My Deliveries</h2>
          <div id="mineList" class="row g-3"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/driver.js"></script>
</body>
</html>
